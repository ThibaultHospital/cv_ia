<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV Interactif & IA Ultra-Rapide</title>
    <!-- Marked pour le Markdown -->
    <script src="https://jsdelivr.net"></script>
    <!-- Transformers.js pour l'IA locale hyper rapide -->
    <script type="module">
        import { pipeline, env } from 'https://jsdelivr.net';
        window.pipeline = pipeline;
    </script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; display: flex; background: var(--bg); color: var(--text); height: 100vh; }
        #cv-container { width: 55%; padding: 2rem; overflow-y: auto; background: #ffffff; border-right: 1px solid #e2e8f0; }
        #ai-container { width: 45%; display: flex; flex-direction: column; background: #f1f5f9; }
        .chat-header { padding: 1rem; background: var(--primary); color: white; font-weight: bold; display: flex; justify-content: space-between; }
        .status { font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 0.2rem 0.5rem; border-radius: 4px; }
        .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
        .message { padding: 0.75rem; border-radius: 0.5rem; max-width: 85%; line-height: 1.4; font-size: 0.95rem; }
        .message.user { background: var(--primary); color: white; align-self: flex-end; }
        .message.ai { background: white; color: var(--text); align-self: flex-start; border: 1px solid #e2e8f0; }
        .chat-input-area { padding: 1rem; display: flex; gap: 0.5rem; background: white; border-top: 1px solid #e2e8f0; }
        input { flex: 1; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.25rem; }
        button { padding: 0.75rem 1.25rem; background: var(--primary); color: white; border: none; border-radius: 0.25rem; cursor: pointer; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        .cv-content h1 { color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    </style>
</head>
<body>

    <div id="cv-container">
        <div id="cv-render" class="cv-content">Chargement du CV en cours...</div>
    </div>

    <div id="ai-container">
        <div class="chat-header">
            <span>🤖 Assistant CV (IA Verrouillée)</span>
            <span id="ai-status" class="status">Initialisation...</span>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message ai">Bonjour ! Je suis une IA locale. Posez-moi une question sur le parcours, les compétences ou les projets du candidat décrits dans le CV.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Posez une question sur le CV..." disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Envoyer</button>
        </div>
    </div>

    <script>
        let cvTextContent = "";
        let qaPipeline = null;

        // 1. Charger et afficher le fichier Markdown
        async function loadMarkdownCV() {
            try {
                const response = await fetch('cv.md');
                if (!response.ok) throw new Error();
                cvTextContent = await response.text();
                document.getElementById('cv-render').innerHTML = marked.parse(cvTextContent);
            } catch (e) {
                document.getElementById('cv-render').innerHTML = "<p style='color:red;'>Créez un fichier 'cv.md' à côté de index.html.</p>";
            }
        }

        // 2. Initialiser le modèle de Question-Answering (Poids ultra-léger ~40Mo, chargement instantané)
        async function initIA() {
            const statusEl = document.getElementById('ai-status');
            try {
                // Utilise un modèle de Question-Answering extractif : il extrait TOUJOURS la réponse directement du texte. Moins de risques d'hallucination, verrouillage total.
                qaPipeline = await window.pipeline('question-answering', 'Xenova/distilbert-base-cased-distilled-squad');
                statusEl.innerText = "⚡ Prêt (Local)";
                statusEl.style.background = "#22c55e";
                document.getElementById('user-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
            } catch (error) {
                statusEl.innerText = "❌ Erreur de chargement";
                console.error(error);
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-messages');
            const msgBubble = document.createElement('div');
            msgBubble.classList.add('message', sender);
            msgBubble.innerText = text;
            container.appendChild(msgBubble);
            container.scrollTop = container.scrollHeight;
        }

        // 3. Traitement de la question avec verrouillage strict
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query || !qaPipeline) return;

            appendMessage(query, 'user');
            input.value = '';

            // Bloquer temporairement l'interface pendant le calcul
            input.disabled = true;

            try {
                // Exécution locale de l'IA en confrontant directement la question au contenu textuel brut du CV
                const result = await qaPipeline(query, cvTextContent);
                
                // Sécurité : Si le score de confiance est trop bas, on verrouille la réponse
                if (result.score < 0.01 || !result.answer.trim()) {
                    appendMessage("Désolé, je ne trouve pas cette information de manière explicite dans le CV. Je suis verrouillé pour ne répondre qu'aux éléments factuels présents sur la page.", 'ai');
                } else {
                    // Réponse exacte extraite du texte
                    appendMessage(`D'après le CV : "... ${result.answer.trim()} ..."`, 'ai');
                }
            } catch (err) {
                appendMessage("Une erreur est survenue lors de l'analyse.", 'ai');
            }

            input.disabled = false;
            input.focus();
        }

        window.onload = () => {
            loadMarkdownCV();
            // Lancer le chargement de l'IA dès l'ouverture (mise en cache automatique par le navigateur)
            setTimeout(initIA, 500); 
        };
    </script>
</body>
</html>
