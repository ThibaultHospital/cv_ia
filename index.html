<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV Interactif & IA Ultra-Rapide</title>
    
    <!-- Chargement global et immédiat des outils -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; display: flex; background: var(--bg); color: var(--text); height: 100vh; }
        #cv-container { width: 55%; padding: 2rem; overflow-y: auto; background: #ffffff; border-right: 1px solid #e2e8f0; }
        #ai-container { width: 45%; display: flex; flex-direction: column; background: #f1f5f9; }
        .chat-header { padding: 1rem; background: var(--primary); color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 0.8rem; background: rgba(255,255,255,0.3); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: normal; }
        .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
        .message { padding: 0.75rem; border-radius: 0.5rem; max-width: 85%; line-height: 1.4; font-size: 0.95rem; }
        .message.user { background: var(--primary); color: white; align-self: flex-end; }
        .message.ai { background: white; color: var(--text); align-self: flex-start; border: 1px solid #e2e8f0; }
        .chat-input-area { padding: 1rem; display: flex; gap: 0.5rem; background: white; border-top: 1px solid #e2e8f0; }
        input { flex: 1; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.25rem; }
        button { padding: 0.75rem 1.25rem; background: var(--primary); color: white; border: none; border-radius: 0.25rem; cursor: pointer; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        .cv-content h1 { color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    </style>
</head>
<body>

    <div id="cv-container">
        <div id="cv-render" class="cv-content">Chargement du CV...</div>
    </div>

    <div id="ai-container">
        <div class="chat-header">
            <span>🤖 Assistant CV (IA Verrouillée)</span>
            <span id="ai-status" class="status">Initialisation...</span>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message ai" id="welcome-msg">Bonjour ! Je télécharge le modèle IA dans votre navigateur pour pouvoir analyser ce CV. Veuillez patienter...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Attente du modèle IA..." disabled>
            <button id="send-btn" onclick="actionSendMessage()" disabled>Envoyer</button>
        </div>
    </div>

    <script>
        let cvTextContent = "";
        let qaPipeline = null;

        // Écoute de la touche Entrée pour valider la question
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') actionSendMessage();
        });

        // 1. CHARGEMENT ASYNCHRONE INSPIRÉ DE VOTRE CODE (Simple, Linéaire et Robuste)
        async function startApp() {
            const statusEl = document.getElementById('ai-status');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const welcomeMsg = document.getElementById('welcome-msg');

            try {
                // Étape A : Charger le fichier Markdown de manière brute
                const response = await fetch('cv.md');
                if (!response.ok) throw new Error(`Fichier cv.md introuvable (Code HTTP ${response.status})`);
                
                cvTextContent = await response.text();
                
                // Conversion et affichage immédiat à gauche
                document.getElementById('cv-render').innerHTML = marked.parse(cvTextContent);

                // Étape B : Lancement du téléchargement de l'IA une fois le fichier traité
                statusEl.innerText = "Téléchargement IA (~40 Mo)...";
                
                // Utilisation de l'API globale vérifiée de Transformers.js
                qaPipeline = await window.transformers.pipeline('question-answering', 'Xenova/distilbert-base-cased-distilled-squad');
                
                // Étape C : Libération de l'interface utilisateur
                statusEl.innerText = "⚡ Prêt (Local)";
                statusEl.style.background = "#22c55e";
                welcomeMsg.innerText = "Modèle prêt ! Posez-moi vos questions sur le parcours, les compétences ou les formations figurant sur le CV.";
                
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.placeholder = "Posez une question sur le CV...";

            } catch (error) {
                document.getElementById('cv-render').innerHTML = `
                    <p style='color:red; font-weight:bold;'>
                        ❌ Erreur d'initialisation de l'application.<br>
                        <span style='font-size:0.85rem; color:#666;'>
                            Détails : ${error.message}. Vérifiez que 'cv.md' se trouve bien au même niveau que 'index.html'.
                        </span>
                    </p>`;
                statusEl.innerText = "❌ Échec";
                console.error(error);
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-messages');
            const msgBubble = document.createElement('div');
            msgBubble.classList.add('message', sender);
            msgBubble.innerText = text;
            container.appendChild(msgBubble);
            container.scrollTop = container.scrollHeight;
        }

        // 2. TRAITEMENT DE LA QUESTION ET SÉCURITÉ DE VERROUILLAGE
        async function actionSendMessage() {
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const query = userInput.value.trim();
            
            if (!query || !qaPipeline) return;

            appendMessage(query, 'user');
            userInput.value = '';
            
            // Verrouillage des contrôles pendant le calcul
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                // L'IA cherche le fragment de réponse uniquement dans le texte brut de cvTextContent
                const result = await qaPipeline(query, cvTextContent);
                
                // Seuil de confiance strict pour bloquer le hors-sujet
                if (result.score < 0.01 || !result.answer.trim()) {
                    appendMessage("Désolé, je ne trouve pas cette réponse dans le document. Je suis verrouillé pour ne répondre qu'à partir des faits présents dans le CV.", 'ai');
                } else {
                    appendMessage(`D'après le CV : "${result.answer.trim()}"`, 'ai');
                }
            } catch (err) {
                appendMessage("Une erreur interne est survenue lors de l'analyse.", 'ai');
                console.error(err);
            }

            // Libération des contrôles
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        // Lancement immédiat et direct de l'application au chargement du script
        startApp();
    </script>
</body>
</html>
